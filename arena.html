<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff7a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Arena · Blobbo</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./update-banner.css">
  <style>
    #arenaHome{position:fixed;z-index:25;left:max(12px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.86);box-shadow:0 5px 16px rgba(43,48,64,.18);color:#2b3040;text-decoration:none;font:900 34px/1 system-ui}
    #hud{left:max(12px,env(safe-area-inset-left))}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <a id="arenaHome" href="./" aria-label="Main menu">‹</a>
  <div id="hud" class="ui"><div id="scoreCard"><div class="label">ARENA</div><div id="scoreVal">0</div><div id="sizeVal">size 26</div></div></div>
  <div id="leaderboard" class="ui"><div class="label">LEADERBOARD</div><ol id="lbList"></ol></div>
  <button id="anchorBtn" aria-label="Anchor"><span id="anchorRing"></span><span class="anchorIcon">⚓</span><span class="anchorLabel">ANCHOR</span></button>
  <div id="hint" class="ui">Move: WASD / drag &nbsp;·&nbsp; Anchor: SPACE / button &nbsp;·&nbsp; drag rivals into hazards!</div>
  <div id="deathOverlay" class="hidden"><div class="deathCard"><div id="deathTitle"></div><div id="deathReason"></div><div id="deathScore"></div><button id="restartBtn">PLAY AGAIN</button></div></div>
  <div id="updateToast" class="update-toast hidden" role="status"><span>A new little world is ready.</span><button id="updateBtn" type="button">UPDATE</button></div>
  <script src="./game.js"></script>
  <script src="./pwa.js"></script>
</body>
</html>
