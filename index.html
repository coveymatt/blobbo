<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4b45f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blobbo">
  <meta name="description" content="A tiny world of blobs, relationships, and emergent physics.">
  <title>Blobbo</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./menu.css">
</head>
<body>
  <main class="menu-shell">
    <section class="hero" aria-labelledby="title">
      <div class="sun"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div>
      <div class="hill hill-back"></div><div class="hill hill-front"></div>
      <div class="hero-blob pip"><i></i><i></i></div><div class="hero-blob sprout"><i></i><i></i></div>
      <div class="hero-blob pebble"><i></i><i></i></div><div class="hero-blob toasty"><i></i><i></i></div><div class="seed"></div>
      <div class="logo-lockup"><img src="./icons/icon.svg" width="96" height="96" alt=""><div><h1 id="title">Blobbo</h1><p>A little world that remembers you.</p></div></div>
    </section>
    <section class="choices" aria-label="Choose a way to play">
      <a class="mode-card adventure-card" href="./adventure.html?v=6"><span class="mode-icon" aria-hidden="true">🌱</span><span class="mode-copy"><strong>Adventure</strong><small>Meet the Blobbos. Help if you want. See what changes.</small></span><span class="go" aria-hidden="true">›</span></a>
      <a class="mode-card arena-card" href="./arena.html"><span class="mode-icon" aria-hidden="true">⚓</span><span class="mode-copy"><strong>Arena</strong><small>Grow, tether, and wrestle rivals into hazards.</small></span><span class="go" aria-hidden="true">›</span></a>
    </section>
    <button id="installBtn" class="install-button hidden" type="button"><span aria-hidden="true">↓</span> Install Blobbo</button>
  </main>
  <div id="iosInstallOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="iosInstallTitle"><div class="install-card"><button id="closeInstallBtn" class="close-button" type="button" aria-label="Close">×</button><img src="./icons/icon.svg" alt="" width="88" height="88"><h2 id="iosInstallTitle">Install Blobbo</h2><div class="install-step"><span aria-hidden="true">□↑</span><b>Tap Share</b></div><div class="install-step"><span aria-hidden="true">＋</span><b>Add to Home Screen</b></div></div></div>
  <div id="updateToast" class="toast hidden" role="status"><span>A new little world is ready.</span><button id="updateBtn" type="button">Update</button></div>
  <script src="./pwa.js?v=6"></script>

</html>
